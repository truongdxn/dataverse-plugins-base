# Azure DevOps equivalent of .github/workflows/build.yml. Keep the two in step.
#
# Builds every solution in the repo and publishes each .zip. There is deliberately no deploy
# stage: importing a package is another module's job, so this pipeline holds no environment
# credentials at all.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Reused as the solution version so a package can always be traced back to its build.
  solutionVersion: '1.0.0.$(Build.BuildId)'

stages:
  - stage: Build
    jobs:
      - job: BuildAndPack
        # Plugin assemblies and their tests target net462; the packager wants Windows.
        pool:
          vmImage: windows-latest

        steps:
          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: sdk
              version: 8.0.x

          - script: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
            displayName: Install Power Platform CLI

          - pwsh: ./build/build.ps1 -Configuration Release
            displayName: Build, validate and test every solution

          - pwsh: dotnet test CRM/Shared/PluginBase/PluginBase.sln --configuration Release --nologo
            displayName: Test the tooling

          - pwsh: ./build/pack.ps1 -Configuration Release -Version $(solutionVersion)
            displayName: Pack every solution

          - publish: CRM/Solutions
            artifact: solution-packages
            displayName: Publish solution packages

          - pwsh: ./build/pack-packages.ps1 -Clean -Configuration Release -Version 1.0.0-ci.$(Build.BuildId)
            displayName: Pack the base as NuGet packages

          - publish: artifacts/packages
            artifact: nuget-packages
            displayName: Publish NuGet packages
