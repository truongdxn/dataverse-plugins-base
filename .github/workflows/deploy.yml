name: build and deploy

# The package is built once, from source, and the same file is what reaches every environment.
# Nothing built is committed - artifacts/ is git-ignored and regenerated on every run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployTo:
        description: Environment to import the package into after building
        required: true
        default: test
        type: choice
        options: [test, prod]

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    # Plugin assemblies target net462. The .NET SDK builds that without Visual Studio via
    # Microsoft.NETFramework.ReferenceAssemblies, but the packager still wants Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Build and validate
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test DataverseBase.sln --configuration Release --nologo

      - name: Pack
        shell: pwsh
        # Packing needs no Dataverse connection: step ids come from source and message ids from
        # the committed config/sdkmessages.json.
        run: ./build/pack.ps1 -Configuration Release -Version 1.0.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: solution-package
          path: artifacts/*.zip
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    # Gates the run behind whatever approvals the GitHub environment requires.
    environment: ${{ inputs.deployTo }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: solution-package
          path: artifacts

      - name: Import solution
        shell: pwsh
        # Names must match the *Var entries in config/environments.json. Secrets are read from
        # the environment, never from a committed file.
        env:
          DV_TEST_TENANT_ID: ${{ secrets.DV_TENANT_ID }}
          DV_TEST_CLIENT_ID: ${{ secrets.DV_CLIENT_ID }}
          DV_TEST_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
          DV_PROD_TENANT_ID: ${{ secrets.DV_TENANT_ID }}
          DV_PROD_CLIENT_ID: ${{ secrets.DV_CLIENT_ID }}
          DV_PROD_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
        run: |
          $package = (Get-ChildItem artifacts/*.zip | Select-Object -First 1).FullName
          ./build/deploy.ps1 -Environment ${{ inputs.deployTo }} -Task import -Package $package
